# Render 블루프린트 — 대시보드에서 New > Blueprint 로 이 저장소를 고르면 자동 설정됩니다.
services:
  - type: web
    name: mulbineul-island
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Neon 등 Postgres 접속 주소. 대시보드에서 직접 붙여 넣습니다 (저장소에는 저장되지 않음).
      - key: DATABASE_URL
        sync: false
